# Déploiement Railway.
#
# À FAIRE DANS LE PROJET RAILWAY :
#
#   1. Variables :
#        BD_PASSWORD=…                  OBLIGATOIRE. Sans elle le serveur refuse
#                                       de démarrer : hébergé, c'est le seul
#                                       verrou entre le journal et l'internet.
#        BD_DB=/data/braindebugger.db   sinon la base est perdue à chaque déploiement
#        ANTHROPIC_API_KEY=sk-ant-…     si le backend Claude est utilisé
#
#   2. Volume monté sur /data, AVANT le premier déploiement.
#
#   3. Settings › Networking › Generate Domain, sinon le service reste
#      « Unexposed » et n'est joignable par personne.
#
# Ne PAS définir PORT ni HOST : Railway fournit PORT, et l'app détecte la
# plateforme pour écouter sur 0.0.0.0 toute seule.
#
# Si le build choisit une version de Node antérieure à 22.5, `node:sqlite`
# n'existe pas et le conteneur s'arrête au démarrage. .nvmrc fixe la version ;
# au besoin, forcer avec NIXPACKS_NODE_VERSION=22.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
