# Déploiement Railway.
#
# À FAIRE DANS LE PROJET RAILWAY :
#
#   1. Un verrou — OBLIGATOIRE. Sans lui le serveur refuse de démarrer :
#      hébergé, c'est la seule chose entre le journal et l'internet.
#      Au choix :
#
#        BD_PASSWORD=…                    un seul journal, une personne
#
#      ou, pour que plusieurs personnes aient chacune le leur :
#
#        BD_DISCORD_CLIENT_ID=…           Discord Developer Portal › ton app
#        BD_DISCORD_CLIENT_SECRET=…       › OAuth2
#        BD_DISCORD_GUILD=…               facultatif : réserve l'accès aux
#                                         membres d'un serveur Discord donné
#        BD_PUBLIC_URL=https://…          facultatif : force l'URL de retour
#                                         OAuth si le proxy ment sur l'hôte
#
#      L'URL de redirection à déclarer côté Discord est exactement :
#        https://TON-DOMAINE/auth/discord/callback
#
#   2. Autres variables :
#        BD_DB=/data/braindebugger.db     sinon la base est perdue à chaque
#                                         déploiement
#        ANTHROPIC_API_KEY=sk-ant-…       si le backend Claude est utilisé.
#                                         C'est BrainDebugger qui paie : les
#                                         comptes ne branchent aucune clé.
#        BD_TOKEN_ALLOWANCE=500000        facultatif : jetons/mois affichés
#                                         dans la jauge (défaut 500 000)
#
#   3. Volume monté sur /data, AVANT le premier déploiement.
#
#   4. Settings › Networking › Generate Domain, sinon le service reste
#      « Unexposed » et n'est joignable par personne.
#
# Ne PAS définir PORT ni HOST : Railway fournit PORT, et l'app détecte la
# plateforme pour écouter sur 0.0.0.0 toute seule.
#
# Si le build choisit une version de Node antérieure à 22.5, `node:sqlite`
# n'existe pas et le conteneur s'arrête au démarrage. .nvmrc fixe la version ;
# au besoin, forcer avec NIXPACKS_NODE_VERSION=22.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 2

# Pas de healthcheckPath volontairement. Sur un service à un seul conteneur il
# n'apporte rien — si le process tourne, le domaine répond — et il masque la
# vraie erreur derrière un « Deployment failed » opaque. L'endpoint /healthz
# reste servi par l'app si on veut le brancher plus tard.
