<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>BrainDebugger</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦌</text></svg>">
</head>
<body>
<div class="shell">
  <!-- Le rail. Constant d'une vue à l'autre : c'est l'identité de l'application,
       le compagnon, et le décor du moment. Rien qui change quand on navigue. -->
  <aside class="rail">
    <div class="brand">
      <b>BrainDebugger</b>
      <span id="dayline"></span>
    </div>

    <div class="railmid">
      <div class="petcard">
        <div class="art" id="art" tabindex="0" role="button"
             aria-label="Changer l'image du compagnon"></div>
        <input type="file" id="petPick" accept="image/*" hidden>
      </div>
      <p class="petsay" id="petSay"></p>
    </div>

    <div class="railfoot">
      <div class="railqui">
        <button class="gauge" id="gauge" aria-haspopup="dialog" aria-expanded="false" hidden></button>
        <!-- Le mode prive s'allume dans la seconde qui precede un partage
             d'ecran : il lui faut un bouton qui est LA, tout le temps. Il vit
             a cote du compte parce que c'est la meme question -- qui regarde. -->
        <button class="floubtn" id="flou" data-bascule-pudique aria-pressed="false"
                aria-label="Mode privé" data-tip="Mode privé — Ctrl+Maj+P">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path class="oeil" d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/>
            <circle class="iris" cx="12" cy="12" r="2.8"/>
            <line class="barre" x1="4" y1="20" x2="20" y2="4"/>
          </svg>
        </button>
      </div>
      <div class="ambianceread" id="ambianceRead" hidden></div>
    </div>
  </aside>

  <div class="panel">
    <header class="top">
      <div class="viewname" id="viewName"></div>
      <nav>
        <button data-view="tonight">Parler</button>
        <button data-view="moi">Moi</button>
        <button data-view="year">Année</button>
        <button data-view="mirror">Ma carte</button>
        <button data-view="settings">Réglages</button>
      </nav>
    </header>
    <main id="view"></main>
  </div>
</div>
<div class="gaugepanel" id="gaugePanel" role="dialog" aria-label="Jetons restants" hidden></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
