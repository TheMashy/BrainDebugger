<meta charset="utf-8">
<title>les formes fabriquées</title>
<style>
  body { margin:0; background:#0b0f0d; color:#e9efeb; font:13px/1.5 system-ui, sans-serif; }
  figure { margin:0; padding:16px 0 26px; border-bottom:1px solid #1c2320; }
  figcaption { padding:0 18px 10px; color:#7f8f86; }
  figcaption b { color:#e9efeb; font-weight:600; font-size:14px; }
  canvas { display:block; margin:0 auto; }
</style>
<div id="tout"></div>
<script type="module">
  import { versGraphe, dessinerRelations, cadrer, tenueDe } from '/relations.js';
  import { disposer } from '/carte.js';
  import { CAS, fabriquer } from '/echantillons.mjs';
  const L = 1180, H = 640, dpr = 2;
  for (const c of CAS) {
    const { carte, pistes } = fabriquer(c.o);
    const G = versGraphe(carte, pistes);
    const d = disposer(G, L, H);
    cadrer(d.pts, L, H);
    const f = document.createElement('figure');
    const cap = document.createElement('figcaption');
    const gardes = G.ilots.filter(a => tenueDe(a) > 0).length;
    cap.innerHTML = `<b>${c.id}</b> — ${c.titre} · ${G.noeuds.length} nœuds, ${G.liens.length} liens, `
      + `${G.ilots.length} îlots dont ${gardes} avec enveloppe`;
    const cv = document.createElement('canvas');
    cv.width = L * dpr; cv.height = H * dpr; cv.style.width = L + 'px'; cv.style.height = H + 'px';
    f.append(cap, cv); document.getElementById('tout').append(f);
    dessinerRelations(cv.getContext('2d'), G, d, { largeur: L, hauteur: H, dpr });
  }
  window.pret = true;
</script>
